name: build

on:
  push:
    branches: ["main", "dev/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Transform packaged client mixins through Fabric
        run: ./gradlew mixinSmoke --no-daemon > build/mixin-smoke.txt

      - name: Transform client mixins with Sodium
        run: |
          curl -fsSL https://cdn.modrinth.com/data/AANobbMI/versions/bAZQdGpg/sodium-fabric-0.9.2%2Bmc26.3.jar -o build/smoke-sodium.jar
          ./gradlew mixinSmoke -PsmokeMods=build/smoke-sodium.jar --no-daemon > build/mixin-smoke-sodium.txt

      - name: Benchmark actual Minecraft terrain sampling
        run: ./gradlew terrainBenchmark --no-daemon > build/terrain-benchmark.txt

      - name: Benchmark persistent command scaling
        run: ./gradlew rendererScalingBenchmark --no-daemon > build/renderer-scaling-benchmark.txt

      - name: Benchmark sparse Minecraft sampling and source reuse
        run: ./gradlew sparseSamplingBenchmark --no-daemon > build/sparse-sampling-benchmark.txt

      - name: Benchmark source cache pressure and region I/O
        run: ./gradlew sourcePressureBenchmark --no-daemon > build/source-pressure-benchmark.txt

      - name: Benchmark stepped coverage geometry and ownership packing
        run: ./gradlew steppedCoverageBenchmark --no-daemon > build/stepped-coverage-benchmark.txt

      - name: Check production ownership shader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1-mesa-dri
          curl -fsSL https://piston-data.mojang.com/v1/objects/e877b6a07acd633fb3bb475002175cec036e7b87/client.jar -o build/shader-validation-client.jar
          python3 tools/check_ownership_shader.py build/shader-validation-client.jar build/libs/everview-*.jar > build/ownership-shader-check.txt

      - name: Upload test reports and benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everview-validation
          path: |
            build/terrain-benchmark.txt
            build/renderer-scaling-benchmark.txt
            build/sparse-sampling-benchmark.txt
            build/source-pressure-benchmark.txt
            build/stepped-coverage-benchmark.txt
            build/ownership-shader-check.txt
            build/mixin-smoke.txt
            build/mixin-smoke-sodium.txt
            build/reports/tests/test

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: everview-build
          path: build/libs/*.jar
