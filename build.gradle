plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.version
group = project.group

base {
    archivesName = "everview"
}

repositories {
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "everview" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    def nativeOs = System.getProperty('os.name').toLowerCase().contains('win') ? 'windows' :
            (System.getProperty('os.name').toLowerCase().contains('mac') ? 'macos' : 'linux')
    def nativeArch = System.getProperty('os.arch') in ['aarch64', 'arm64'] ? '-arm64' : ''
    testRuntimeOnly "org.lwjgl:lwjgl:3.4.3:natives-${nativeOs}${nativeArch}"
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}

tasks.register('terrainBenchmark', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.everview.terrain.NoiseBatchBenchmark'
    maxHeapSize = '2G'
}

tasks.register('rendererScalingBenchmark', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.everview.client.RendererScalingBenchmark'
    maxHeapSize = '2G'
}
